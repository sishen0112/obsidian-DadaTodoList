name: 🐛 Bug 反馈 / Bug report
description: 遇到了不对劲的地方？告诉我怎么复现 / Spotted something broken? Tell me how to reproduce it
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交之前，先帮我确认下这几点，能省掉不少来回：

        1. 已经去 README 里翻过、没找到答案；
        2. 用的是**最新版本**插件（设置 → 第三方插件 → 检查更新）；
        3. 临时关掉其他插件后，问题还在。

        *Before submitting, please check the README, update to the latest version, and confirm the issue persists with other plugins disabled.*

  - type: input
    id: plugin-version
    attributes:
      label: 你用的是哪个版本？/ Plugin version
      description: 在 设置 → 第三方插件 → Dada Todo List 里能看到
      placeholder: "0.5.1"
    validations:
      required: true

  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian 版本 / Obsidian version
      description: 设置 → 关于
      placeholder: "1.11.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 跑在哪台设备上？/ Platform
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS / iPadOS
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？/ What happened
      description: 实际表现是怎样的？你期待的又是怎样？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 怎么复现？/ Steps to reproduce
      description: 如果能稳定触发，把每一步写清楚就行
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏（可选）/ Screenshots or recordings
      description: 直接把图片拖进来。涉及私人任务内容的话，记得先打码~
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认一下 / Confirmation
      options:
        - label: 我已经更新到最新版本，也去 README 里找过答案了
          required: true
        - label: 我试过关掉其他插件再试一次（可选，但能帮我更快定位）
          required: false

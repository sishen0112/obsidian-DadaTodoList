name: ✨ 功能建议 / Feature request
description: 提出一个新功能或改进 / Suggest a feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        好的功能建议描述的是**问题**，而不是解决方案——这样我才能判断有没有更轻量的做法。

        *A good feature request describes the problem, not the solution.*

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题 / The problem you are trying to solve
      description: 现在做这件事的时候，具体哪里不顺手？
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: 你现在是怎么绕过这个问题的 / Current workaround
      description: 如果有的话。这一栏很有用——它能说明这个问题对你有多严重
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: 你设想的做法 / Your proposed solution
      description: 如果你已经有具体想法，写在这里
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 你觉得这个需求的影响范围 / How widely would this apply
      options:
        - 大多数用户都会用到 / Most users
        - 一部分用户会用到 / Some users
        - 主要是我自己的用法 / Mostly my own workflow
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认 / Confirmation
      options:
        - label: 我理解功能建议会被评估，但不一定会实现
          required: true

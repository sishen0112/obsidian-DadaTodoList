name: ✨ 功能建议 / Feature request
description: 有个想法想加进来？说说你遇到的问题 / Got an idea? Tell me about the problem you're hitting
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        比起直接给方案，先讲清楚你卡在哪会更管用——我也许能用更轻巧的办法解决。

        *A good feature request starts with the problem, not the solution.*

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么？/ The problem you're trying to solve
      description: 现在做这件事时，哪里最别扭？
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: 现在怎么凑合用的？/ Current workaround
      description: 有的话写写。这一栏其实很有用，能帮我判断这事对你有多重要
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: 你心里想的方案 / Your proposed solution
      description: 已经有具体想法就写这儿，没有也完全没关系
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 大概多少人会用到？/ How widely would this apply
      options:
        - 大部分用户都会用到 / Most users
        - 一部分用户会用 / Some users
        - 主要我自己用 / Mostly my own workflow
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 最后确认下 / Confirmation
      options:
        - label: 我理解：作者会评估每条建议，但不保证都能做出来
          required: true
